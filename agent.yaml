id: corerank
name: CoreRank
description: 游戏匹配、排行榜与本地房间资源分配服务
type: go-service
root: .

health:
  url: http://127.0.0.1:8081/readyz
  liveness_url: http://127.0.0.1:8081/healthz

metrics:
  gateway: http://127.0.0.1:19080/metrics
  rank_service: http://127.0.0.1:19081/metrics
  match_service: http://127.0.0.1:19082/metrics
  format: prometheus

capabilities_endpoint:
  url: http://127.0.0.1:8081/api/agent/capabilities

commands:
  test:
    command: go test ./...
    mode: 自动审查
  vet:
    command: go vet ./...
    mode: 自动审查
  smoke:
    command: powershell -ExecutionPolicy Bypass -File scripts/distributed_smoke.ps1
    mode: 需要本地 Compose 栈

docs:
  - README.md
  - docs/api.md
  - docs/architecture.md
  - docs/verification.md
  - docs/agent-integration.md

capabilities:
  - readiness
  - metrics
  - go_test
  - go_vet
  - leaderboard_query
  - player_rank_query
  - match_ticket_diagnose
  - room_server_query

forbidden:
  - direct_redis_delete
  - production_rank_write_without_confirm
  - production_match_settlement_without_confirm
  - production_deploy_without_confirm
