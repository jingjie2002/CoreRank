services:
  # ============================================================================
  # Redis - 核心数据存储
  # ============================================================================
  # Redis 承担匹配池（ZSet）和排行榜（ZSet）的存储职责
  # 使用 Alpine 镜像减小体积，appendonly 保证数据持久化
  corerank-redis:
    image: redis:7.2-alpine
    container_name: corerank-redis
    ports:
      - "127.0.0.1:${CORERANK_REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ============================================================================
  # MySQL - 可选持久化存储
  # ============================================================================
  # 默认映射到宿主机 3307，避免和用户本机已有 MySQL 3306 冲突
  corerank-mysql:
    image: mysql:8.4
    container_name: corerank-mysql
    ports:
      - "127.0.0.1:${CORERANK_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CORERANK_MYSQL_ROOT_PASSWORD:-corerank_root}
      MYSQL_DATABASE: ${CORERANK_MYSQL_DATABASE:-corerank}
      MYSQL_USER: ${CORERANK_MYSQL_USER:-corerank}
      MYSQL_PASSWORD: ${CORERANK_MYSQL_PASSWORD:-corerank_demo}
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_0900_ai_ci'
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # Rank Service - 排行榜独立 gRPC 服务
  # ============================================================================
  corerank-rank-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ./cmd/rank-service
    image: corerank/rank-service:local
    container_name: corerank-rank-service
    ports:
      - "127.0.0.1:18081:18081"
      - "127.0.0.1:19081:19081"
    environment:
      REDIS_ADDR: corerank-redis:6379
      RANK_GRPC_ADDR: :18081
      RANK_METRICS_ADDR: :19081
      CORERANK_MYSQL_DSN: ${CORERANK_MYSQL_DSN:-}
      CORERANK_MYSQL_REQUIRED: ${CORERANK_MYSQL_REQUIRED:-false}
    depends_on:
      corerank-redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Match Service - 匹配独立 gRPC 服务
  # ============================================================================
  corerank-match-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ./cmd/match-service
    image: corerank/match-service:local
    container_name: corerank-match-service
    ports:
      - "127.0.0.1:18082:18082"
      - "127.0.0.1:19082:19082"
    environment:
      REDIS_ADDR: corerank-redis:6379
      MATCH_GRPC_ADDR: :18082
      MATCH_METRICS_ADDR: :19082
      MATCH_WORKER_ENABLED: "true"
      CORERANK_MYSQL_DSN: ${CORERANK_MYSQL_DSN:-}
      CORERANK_MYSQL_REQUIRED: ${CORERANK_MYSQL_REQUIRED:-false}
    depends_on:
      corerank-redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Gateway - HTTP API 网关
  # ============================================================================
  corerank-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ./cmd/gateway
    image: corerank/gateway:local
    container_name: corerank-gateway
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:19080:19080"
    environment:
      GATEWAY_HTTP_ADDR: :8081
      GATEWAY_METRICS_ADDR: :19080
      RANK_GRPC_TARGET: corerank-rank-service:18081
      MATCH_GRPC_TARGET: corerank-match-service:18082
      CORERANK_API_KEY: ${CORERANK_API_KEY:-}
    depends_on:
      - corerank-rank-service
      - corerank-match-service
    restart: unless-stopped

  # ============================================================================
  # RoomServer - TCP 房间服示例
  # ============================================================================
  corerank-roomserver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ./cmd/roomserver
    image: corerank/roomserver:local
    container_name: corerank-roomserver
    ports:
      - "127.0.0.1:7001:7001"
    environment:
      ROOM_SERVER_ID: compose-room-1
      ROOM_SERVER_ADDR: :7001
      ROOM_SERVER_PUBLIC_ADDR: 127.0.0.1:7001
      CORE_RANK_HTTP: http://corerank-gateway:8081
      MATCH_MODE: duel
      CAPACITY: 16
      HEARTBEAT_INTERVAL: 2s
      CORERANK_API_KEY: ${CORERANK_API_KEY:-}
      ROOM_MAX_CONNECTIONS: 1024
    depends_on:
      - corerank-gateway
    restart: unless-stopped

  # ============================================================================
  # Prometheus - 监控数据采集
  # ============================================================================
  # Prometheus 定时抓取 Go 服务暴露的 /metrics 端点
  # 存储时序数据，支持 PromQL 查询
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: corerank-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # 挂载配置文件
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # 持久化存储
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    extra_hosts:
      # 允许容器访问宿主机（Windows/Mac Docker Desktop）
      - "host.docker.internal:host-gateway"
    depends_on:
      - corerank-gateway
      - corerank-rank-service
      - corerank-match-service
    restart: unless-stopped

  # ============================================================================
  # Grafana - 监控数据可视化
  # ============================================================================
  # Grafana 连接 Prometheus 数据源，提供可视化仪表盘
  # 默认账号密码：admin / admin
  grafana:
    image: grafana/grafana:11.3.1
    container_name: corerank-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # 持久化存储（仪表盘、数据源配置等）
      - ./data/grafana:/var/lib/grafana
      # 自动配置 Prometheus 数据源和 CoreRank dashboard
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # 初始管理员密码
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # 允许匿名访问（仅开发环境）
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
    restart: unless-stopped
