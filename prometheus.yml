# ============================================================================
# Prometheus 配置文件
# ============================================================================
#
# Prometheus 通过 HTTP 端点抓取（scrape）目标服务的指标数据。
# 本配置定义了抓取间隔和目标地址。

global:
  # scrape_interval 抓取间隔
  # 每 5 秒抓取一次，适合高频观察压测结果
  # 生产环境通常设置为 15s-30s
  scrape_interval: 5s

  # evaluation_interval 规则评估间隔
  # 告警规则评估频率
  evaluation_interval: 5s

# scrape_configs 抓取配置
# 定义要抓取的目标服务
scrape_configs:
  # ============================================================================
  # CoreRank 分布式 Go 服务
  # ============================================================================
  - job_name: 'corerank-gateway'
    static_configs:
      - targets: ['corerank-gateway:19080']
        labels:
          app: 'corerank'
          service: 'gateway'
          env: 'development'

  - job_name: 'corerank-rank-service'
    static_configs:
      - targets: ['corerank-rank-service:19081']
        labels:
          app: 'corerank'
          service: 'rank-service'
          env: 'development'

  - job_name: 'corerank-match-service'
    static_configs:
      - targets: ['corerank-match-service:19082']
        labels:
          app: 'corerank'
          service: 'match-service'
          env: 'development'

  # ============================================================================
  # Prometheus 自监控
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
